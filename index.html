<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Panel Sell Bazaar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0b1020;
      color:white;
      min-height:100vh;
    }

    header{
      background:#121a30;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #273354;
    }

    .logo{
      font-size:22px;
      font-weight:bold;
    }

    button{
      border:0;
      border-radius:8px;
      padding:11px 18px;
      cursor:pointer;
      font-weight:bold;
    }

    .login-btn{
      background:#4f8cff;
      color:white;
    }

    .logout-btn{
      background:#e74c3c;
      color:white;
      display:none;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:25px 15px;
    }

    .hero{
      text-align:center;
      padding:35px 10px;
    }

    .hero h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .hero p{
      color:#aeb8d4;
    }

    .packages{
      display:grid;
      grid-template-columns:
        repeat(auto-fit,minmax(230px,1fr));
      gap:18px;
      margin-top:25px;
    }

    .card{
      background:#121a30;
      border:1px solid #29365d;
      border-radius:14px;
      padding:22px;
      text-align:center;
    }

    .card h2{
      margin-bottom:12px;
    }

    .price{
      font-size:25px;
      font-weight:bold;
      margin:12px 0;
    }

    .duration{
      color:#aeb8d4;
      margin-bottom:18px;
    }

    .order-btn{
      background:#4f8cff;
      color:white;
      width:100%;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      justify-content:center;
      align-items:center;
      padding:15px;
      z-index:10;
    }

    .modal-box{
      background:#121a30;
      width:100%;
      max-width:500px;
      max-height:90vh;
      overflow:auto;
      border-radius:15px;
      padding:25px;
      border:1px solid #29365d;
    }

    .modal-box h2{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-top:13px;
      margin-bottom:6px;
      color:#dce3f5;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #394a78;
      background:#0b1020;
      color:white;
      outline:none;
    }

    .payment-number{
      background:#182441;
      border-radius:8px;
      padding:13px;
      margin-top:10px;
      color:#7ee2ff;
      font-weight:bold;
      word-break:break-word;
    }

    .copy-btn{
      width:100%;
      background:#4f8cff;
      color:white;
      margin-top:8px;
      display:none;
    }

    .submit-btn{
      width:100%;
      background:#20b86b;
      color:white;
      margin-top:20px;
    }

    .close-btn{
      width:100%;
      background:#39445f;
      color:white;
      margin-top:10px;
    }

    .info{
      color:#aeb8d4;
      font-size:13px;
      margin-top:10px;
      line-height:1.5;
    }

    .status{
      text-align:center;
      margin-top:20px;
      color:#aeb8d4;
    }

    .empty{
      text-align:center;
      color:#aeb8d4;
      padding:30px;
    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    Panel Sell Bazaar
  </div>

  <div>

    <button
      id="loginButton"
      class="login-btn"
      onclick="openLogin()">
      Login
    </button>

    <button
      id="logoutButton"
      class="logout-btn"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>



<main class="container">


  <section class="hero">

    <h1>
      Panel Sell Bazaar
    </h1>

    <p>
      Choose your panel package and place your order.
    </p>

  </section>



  <section>

    <h2>
      Available Packages
    </h2>


    <div
      id="packages"
      class="packages">

      <!-- Packages will load from Supabase -->

      <div class="card">

        <h2>
          Aim Hacker
        </h2>

        <div class="price">
          ৳20
        </div>

        <div class="duration">
          1 Hour
        </div>

        <button
          class="order-btn"
          onclick="openOrder('Aim Hacker','1 Hour',20)">

          Order Now

        </button>

      </div>

    </div>


    <div
      id="packageStatus"
      class="status">
    </div>

  </section>


</main>



<!-- =========================
     LOGIN MODAL
========================= -->


<div
  id="loginModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Login / Sign Up
    </h2>


    <label>
      Email
    </label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Enter your email">


    <label>
      Password
    </label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter your password">


    <button
      class="submit-btn"
      onclick="loginUser()">

      Login

    </button>


    <button
      class="submit-btn"
      onclick="signupUser()">

      Sign Up

    </button>


    <button
      class="close-btn"
      onclick="closeLogin()">

      Close

    </button>


    <p class="info">

      New buyer?
      Enter your email and password,
      then press Sign Up.

    </p>


  </div>

</div>



<!-- =========================
     ORDER MODAL
========================= -->


<div
  id="orderModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Place Order
    </h2>


    <label>
      Package
    </label>

    <input
      id="packageTitle"
      type="text"
      readonly>


    <label>
      Duration
    </label>

    <input
      id="packageDuration"
      type="text"
      readonly>


    <label>
      Price
    </label>

    <input
      id="packagePrice"
      type="text"
      readonly>


    <label>
      Your Name
    </label>

    <input
      id="buyerName"
      type="text"
      placeholder="Enter your name">


    <label>
      Phone Number
    </label>

    <input
      id="buyerPhone"
      type="text"
      placeholder="Enter your phone number">


    <label>
      Payment Method
    </label>


    <select
      id="paymentMethod"
      onchange="showPaymentNumber()">

      <option value="">
        Select Payment Method
      </option>

      <option value="bKash">
        bKash
      </option>

      <option value="Nagad">
        Nagad
      </option>

      <option value="Rocket">
        Rocket
      </option>

    </select>



    <div
      id="paymentNumber"
      class="payment-number"
      style="display:none">

    </div>



    <button
      id="copyPaymentNumber"
      type="button"
      class="copy-btn"
      onclick="copyPaymentNumber()">

      Copy Number

    </button>



    <p class="info">

      প্রথমে উপরের নম্বরে payment করুন।
      তারপর Transaction ID এখানে দিন।

    </p>



    <label>
      Transaction ID
    </label>

    <input
      id="transactionId"
      type="text"
      placeholder="Enter Transaction ID">



    <button
      class="submit-btn"
      onclick="submitOrder()">

      Submit Order

    </button>



    <button
      class="close-btn"
      onclick="closeOrder()">

      Close

    </button>


  </div>

</div>



<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
  "https://wiztksrtzjmsxzolollf.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================
   PAYMENT NUMBERS
========================= */


const paymentNumbers = {

  bKash: "01720974862",

  Nagad: "01612652459",

  Rocket: "01720974862"

};



/* =========================
   SELECTED PACKAGE
========================= */


let selectedProduct = "";

let selectedDuration = "";

let selectedPrice = 0;



/* =========================
   LOGIN MODAL
========================= */


function openLogin(){

  document.getElementById(
    "loginModal"
  ).style.display = "flex";

}



function closeLogin(){

  document.getElementById(
    "loginModal"
  ).style.display = "none";

}



/* =========================
   SIGN UP
========================= */


async function signupUser(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    alert(
      "Email and password দিন।"
    );

    return;

  }


  if(password.length < 6){

    alert(
      "Password কমপক্ষে 6 characters হতে হবে।"
    );

    return;

  }


  const { error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password

    });


  if(error){

    alert(
      "Sign Up failed: " +
      error.message
    );

    return;

  }


  alert(
    "Sign Up successful. এখন Login করুন।"
  );

}



/* =========================
   LOGIN
========================= */


async function loginUser(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    alert(
      "Email and password দিন।"
    );

    return;

  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){

    alert(
      "Login failed: " +
      error.message
    );

    return;

  }


  closeLogin();

  updateLoginButton();

  alert(
    "Login successful!"
  );

}



/* =========================
   LOGOUT
========================= */


async function logout(){

  await supabaseClient.auth.signOut();

  updateLoginButton();

  alert(
    "Logged out."
  );

}



/* =========================
   LOGIN BUTTON STATUS
========================= */


async function updateLoginButton(){

  const { data } =
    await supabaseClient.auth.getSession();


  const loggedIn =
    !!data.session;


  document.getElementById(
    "loginButton"
  ).style.display =
    loggedIn
      ? "none"
      : "inline-block";


  document.getElementById(
    "logoutButton"
  ).style.display =
    loggedIn
      ? "inline-block"
      : "none";

}



/* =========================
   OPEN ORDER
========================= */


async function openOrder(
  product,
  duration,
  price
){

  const { data } =
    await supabaseClient.auth.getSession();


  if(!data.session){

    alert(
      "Please login first."
    );

    openLogin();

    return;

  }


  selectedProduct =
    product;


  selectedDuration =
    duration;


  selectedPrice =
    price;



  document.getElementById(
    "packageTitle"
  ).value =
    product;


  document.getElementById(
    "packageDuration"
  ).value =
    duration;


  document.getElementById(
    "packagePrice"
  ).value =
    "৳" + price;



  document.getElementById(
    "orderModal"
  ).style.display =
    "flex";



  /* Load buyer profile */


  const profile =
    await supabaseClient
      .from("Profiles")
      .select(
        '"Name","Phone"'
      )
      .eq(
        "id",
        data.session.user.id
      )
      .maybeSingle();


  if(profile.data){

    document.getElementById(
      "buyerName"
    ).value =
      profile.data.Name || "";


    document.getElementById(
      "buyerPhone"
    ).value =
      profile.data.Phone || "";

  }

}



/* =========================
   CLOSE ORDER
========================= */


function closeOrder(){

  document.getElementById(
    "orderModal"
  ).style.display =
    "none";


  document.getElementById(
    "paymentMethod"
  ).value =
    "";


  document.getElementById(
    "paymentNumber"
  ).style.display =
    "none";


  document.getElementById(
    "paymentNumber"
  ).innerHTML =
    "";


  document.getElementById(
    "copyPaymentNumber"
  ).style.display =
    "none";

}



/* =========================
   SHOW PAYMENT NUMBER
========================= */


function showPaymentNumber(){

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;


  const box =
    document.getElementById(
      "paymentNumber"
    );


  const copyBtn =
    document.getElementById(
      "copyPaymentNumber"
    );


  if(!method){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    copyBtn.style.display =
      "none";

    return;

  }


  const number =
    paymentNumbers[method];


  box.style.display =
    "block";


  box.innerHTML =
    method +
    " Payment Number: " +
    number;


  copyBtn.style.display =
    "block";

}



/* =========================
   COPY PAYMENT NUMBER
========================= */


async function copyPaymentNumber(){

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;


  if(!method){

    return;

  }


  const number =
    paymentNumbers[method];


  try{

    await navigator.clipboard.writeText(
      number
    );


    alert(
      "Payment number copied!"
    );


  }catch(error){

    alert(
      "Copy failed. Please copy the number manually."
    );

  }

}



/* =========================
   SUBMIT ORDER
========================= */


async function submitOrder(){

  const { data: sessionData } =
    await supabaseClient.auth.getSession();


  if(!sessionData.session){

    alert(
      "Please login first."
    );

    return;

  }



  const name =
    document
      .getElementById("buyerName")
      .value
      .trim();



  const phone =
    document
      .getElementById("buyerPhone")
      .value
      .trim();



  const method =
    document
      .getElementById("paymentMethod")
      .value;



  const transaction =
    document
      .getElementById("transactionId")
      .value
      .trim();



  if(
    !name ||
    !phone ||
    !method ||
    !transaction
  ){

    alert(
      "Please fill in all required information."
    );

    return;

  }



  const { error } =
    await supabaseClient
      .from("Orders")
      .insert([{

        user_id:
          sessionData.session.user.id,

        buyer_name:
          name,

        phone:
          phone,

        "package title":
          selectedProduct,

        price:
          selectedPrice,

        duration:
          selectedDuration,

        status:
          "Pending",

        "payment method":
          method,

        "transaction id":
          transaction

      }]);



  if(error){

    alert(
      "Order failed: " +
      error.message
    );

    return;

  }



  alert(
    "Order submitted successfully! Your order is now Pending."
  );



  document.getElementById(
    "transactionId"
  ).value =
    "";



  document.getElementById(
    "paymentMethod"
  ).value =
    "";



  document.getElementById(
    "paymentNumber"
  ).style.display =
    "none";



  document.getElementById(
    "paymentNumber"
  ).innerHTML =
    "";



  document.getElementById(
    "copyPaymentNumber"
  ).style.display =
    "none";



  closeOrder();

}



/* =========================
   LOAD PACKAGES FROM SUPABASE
========================= */


async function loadPackages(){

  const container =
    document.getElementById(
      "packages"
    );


  const status =
    document.getElementById(
      "packageStatus"
    );


  status.innerHTML =
    "Loading packages...";



  const result =
    await supabaseClient
      .from("Package")
      .select(
        "id,title,price,duration"
      )
      .order(
        "id",
        {
          ascending:true
        }
      );



  if(result.error){

    console.log(
      "Package load error:",
      result.error.message
    );


    status.innerHTML =
      "";


    return;

  }



  if(
    !result.data ||
    result.data.length === 0
  ){

    status.innerHTML =
      "No packages available.";

    return;

  }



  container.innerHTML =
    "";



  result.data.forEach(
    function(p){

      container.innerHTML += `

        <div class="card">

          <h2>
            ${escapeHtml(p.title)}
          </h2>

          <div class="price">
            ৳${Number(p.price).toFixed(0)}
          </div>

          <div class="duration">
            ${escapeHtml(p.duration)}
          </div>

          <button
            class="order-btn"
            onclick='openOrder(
              ${JSON.stringify(p.title)},
              ${JSON.stringify(p.duration)},
              ${Number(p.price)}
            )'>

            Order Now

          </button>

        </div>

      `;

    }
  );



  status.innerHTML =
    "";

}



/* =========================
   ESCAPE HTML
========================= */


function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================
   PAGE LOAD
========================= */


updateLoginButton();

loadPackages();



</script>


</body>

</html>
