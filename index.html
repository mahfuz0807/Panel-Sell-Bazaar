<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Sell Bazaar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111}.hidden{display:none!important}.topbar{background:#111827;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10}.brand{font-size:20px;font-weight:bold}.top{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.container{max-width:1100px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:35px 20px;border-radius:15px;margin-bottom:20px}.hero h1{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:16px;box-shadow:0 3px 15px #0001}.card img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-bottom:10px}.price{font-size:20px;font-weight:bold;color:#2563eb}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#2563eb;color:white;margin:4px 2px}.btn.secondary{background:#374151}.btn.green{background:#16a34a}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.box{background:white;width:100%;max-width:430px;border-radius:14px;padding:22px;position:relative;max-height:90vh;overflow:auto}.close{position:absolute;right:15px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}.box h2{margin-top:0}.box label{display:block;margin:10px 0 5px;font-weight:bold}.box input,.box select,.box textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.msg{margin:10px 0;padding:9px;border-radius:7px;background:#eef2ff}.error{background:#fee2e2;color:#991b1b}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap}.empty{text-align:center;padding:25px;color:#666}.payment{background:#f3f4f6;border-radius:9px;padding:12px;margin:10px 0}.success{color:#15803d;font-weight:bold}
</style>
</head>
<body>

<header class="topbar">
<div class="brand">Panel Sell Bazaar</div>
<button class="top" id="topBtn" onclick="openAuth('login')">Login</button>
</header>

<main class="container">
<section class="hero">
<h1>Panel Sell Bazaar</h1>
<p>Buy panels easily and securely.</p>
</section>

<div class="nav">
<button class="btn" onclick="showPage('home')">Home</button>
<button class="btn" onclick="showPage('packages')">Packages</button>
<button class="btn" onclick="showPage('orders')">Orders</button>
<button class="btn" onclick="showPage('balance')">Balance</button>
<button class="btn" onclick="showPage('access')">Access</button>
<button class="btn" onclick="showPage('profile')">Profile</button>
</div>

<section id="homePage">
<h2>Available Packages</h2>
<div id="publicPkgs" class="grid"><div class="empty">Loading...</div></div>
</section>

<section id="packagesPage" class="hidden">
<h2>All Packages</h2>
<div id="packagesList" class="grid"></div>
</section>

<section id="ordersPage" class="hidden">
<h2>My Orders</h2>
<div id="ordersList"></div>
</section>

<section id="balancePage" class="hidden">
<h2>My Balance</h2>
<div class="card"><h3 id="myBalance">0 Tk</h3><button class="btn green" onclick="openTopup()">Balance Top Up</button></div>
</section>

<section id="accessPage" class="hidden">
<h2>Panel Access</h2>
<div id="accessList"></div>
</section>

<section id="profilePage" class="hidden">
<h2>My Profile</h2>
<div class="card" id="profileInfo">Login required.</div>
</section>
</main>

<div id="auth" class="modal hidden" onclick="if(event.target===this)closeAuth()">
<div class="box">
<button class="close" onclick="closeAuth()">×</button>
<h2 id="authTitle">Login</h2>
<div id="authMsg"></div>

<div id="signup" class="hidden">
<label>Name</label>
<input id="name" type="text" placeholder="Your name">
<label>Phone</label>
<input id="phone" type="tel" placeholder="Phone number">
</div>

<label>Gmail</label>
<input id="email" type="email" placeholder="example@gmail.com">

<label>Password</label>
<input id="pass" type="password" placeholder="Minimum 6 characters">

<button id="authBtn" class="btn" style="width:100%;margin-top:15px" onclick="auth()">Login</button>

<div class="row">
<button class="btn secondary" onclick="mode('login')">Login</button>
<button class="btn green" onclick="mode('signup')">Create Account</button>
</div>
</div>
</div>

<div id="pkgModal" class="modal hidden" onclick="if(event.target===this)closePkg()">
<div class="box">
<button class="close" onclick="closePkg()">×</button>
<div id="pkgDetails"></div>
</div>
</div>

<div id="topupModal" class="modal hidden" onclick="if(event.target===this)closeTopup()">
<div class="box">
<button class="close" onclick="closeTopup()">×</button>
<h2>Balance Top Up</h2>
<label>Payment Method</label>
<select id="topMethod" onchange="showPayNumber()">
<option value="">Select Method</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
<option value="Rocket">Rocket</option>
</select>
<div id="payNumber" class="payment"></div>
<label>Amount</label>
<input id="topAmount" type="number" placeholder="Amount">
<label>Transaction ID</label>
<input id="topTxn" type="text" placeholder="Transaction ID">
<button class="btn green" onclick="submitTopup()">Submit</button>
<div id="topMsg"></div>
</div>
</div>

<script>
const SUPABASE_URL='https://wiztksrtzjmsxzolollf.supabase.co';
const SUPABASE_KEY='sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,PAY={bKash:'',Nagad:'',Rocket:''};

const $=id=>document.getElementById(id);

function msg(id,text,error=false){$(id).innerHTML='<div class="msg '+(error?'error':'')+'">'+esc(text)+'</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function openAuth(m='login'){mode(m);$('auth').classList.remove('hidden')}
function closeAuth(){$('auth').classList.add('hidden');$('authMsg').innerHTML=''}
function mode(m){
const s=m==='signup';
$('signup').classList.toggle('hidden',!s);
$('authTitle').textContent=s?'Create Account':'Login';
$('authBtn').textContent=s?'Create Account':'Login';
$('authMsg').innerHTML='';
}

async function auth(){
const email=$('email').value.trim().toLowerCase(),pass=$('pass').value,s=!$('signup').classList.contains('hidden');
if(!email.endsWith('@gmail.com'))return msg('authMsg','Please use a Gmail address.',true);
if(pass.length<6)return msg('authMsg','Password must be at least 6 characters.',true);
$('authBtn').disabled=true;
msg('authMsg','Processing...');
try{
if(s){
const name=$('name').value.trim(),phone=$('phone').value.trim();
if(!name)return msg('authMsg','Name is required.',true);
if(!phone)return msg('authMsg','Phone is required.',true);
const r=await db.auth.signUp({email,password:pass,options:{data:{name:name,phone:phone}}});
if(r.error)throw r.error;
if(r.data.session){
user=r.data.user;await ensureProfile();closeAuth();await start();
}else{
msg('authMsg','Account created. Now Login করুন.');
$('pass').value='';mode('login');
}
}else{
const r=await db.auth.signInWithPassword({email,password:pass});
if(r.error)throw r.error;
user=r.data.user;await ensureProfile();closeAuth();await start();
}
}catch(e){msg('authMsg',e.message||'Login failed.',true)}
finally{$('authBtn').disabled=false}
}

async function ensureProfile(){
if(!user)return;
let r=await db.from('Profiles').select('*').eq('id',user.id).maybeSingle();
if(r.error)throw r.error;
if(r.data){profile=r.data;return}
const n=user.user_metadata?.name||'Buyer',p=user.user_metadata?.phone||'';
const c=await db.from('Profiles').insert([{id:user.id,Name:n,Phone:p,Role:'buyer',balance:0}]).select().single();
if(c.error)throw c.error;
profile=c.data;
}

async function loadPaymentSettings(){
const r=await db.from('Payment Settings').select('id,bkash_number,nagad_number,rocket_number').eq('id',1).maybeSingle();
if(!r.error&&r.data)PAY={bKash:r.data.bkash_number||'',Nagad:r.data.nagad_number||'',Rocket:r.data.rocket_number||''};
}

async function loadPublic(){
const r=await db.from('Package').select('id,title,price,duration,image_url').order('id',{ascending:false});
if(r.error){$('publicPkgs').innerHTML='<div class="empty">Packages load হয়নি।</div>';return}
renderPkgs($('publicPkgs'),r.data||[]);
renderPkgs($('packagesList'),r.data||[]);
}

function renderPkgs(el,data){
if(!data.length){el.innerHTML='<div class="empty">No packages available.</div>';return}
el.innerHTML=data.map(p=>`<div class="card">${p.image_url?`<img src="${esc(p.image_url)}" onerror="this.style.display='none'">`:''}<h3>${esc(p.title)}</h3><div class="price">${esc(p.price)} Tk</div><p>Duration: ${esc(p.duration)}</p><button class="btn secondary" onclick="viewPkg(${p.id})">View Package</button><button class="btn green" onclick="buy(${p.id})">🛒 Buy Now</button></div>`).join('');
}

async function viewPkg(id){
const r=await db.from('Package').select('*').eq('id',id).single();
if(r.error)return alert(r.error.message);
const p=r.data;
$('pkgDetails').innerHTML=`${p.image_url?`<img src="${esc(p.image_url)}" style="width:100%;max-height:220px;object-fit:contain">`:''}<h2>${esc(p.title)}</h2><p><b>Price:</b> ${esc(p.price)} Tk</p><p><b>Duration:</b> ${esc(p.duration)}</p><button class="btn green" onclick="buy(${p.id})">🛒 Buy Now</button>`;
$('pkgModal').classList.remove('hidden');
}
function closePkg(){$('pkgModal').classList.add('hidden')}

async function buy(id){
if(!user){closePkg();openAuth('login');return}
closePkg();
const r=await db.from('Package').select('*').eq('id',id).single();
if(r.error)return alert(r.error.message);
const p=r.data;
if(!confirm('Order '+p.title+' for '+p.price+' Tk?'))return;
const o=await db.from('Orders').insert([{buyer_id:user.id,package_id:p.id,status:'Pending'}]);
if(o.error)alert(o.error.message);else{alert('Order submitted successfully.');showPage('orders')}
}

function showPage(page){
['home','packages','orders','balance','access','profile'].forEach(x=>$(x+'Page').classList.add('hidden'));
$(page+'Page').classList.remove('hidden');
if(page==='orders')loadOrders();
if(page==='balance')loadBalance();
if(page==='access')loadAccess();
if(page==='profile')loadProfile();
if(page==='packages')loadPublic();
}

async function loadOrders(){
if(!user)return $('ordersList').innerHTML='<div class="empty">Please Login first.</div>';
const r=await db.from('Orders').select('*').eq('buyer_id',user.id).order('id',{ascending:false});
if(r.error)return $('ordersList').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';
$('ordersList').innerHTML=r.data.length?r.data.map(o=>`<div class="card" style="margin-bottom:10px"><b>Order #${o.id}</b><p>Status: ${esc(o.status)}</p>${o.access_key?`<p class="success">Access Key: ${esc(o.access_key)}</p>`:''}</div>`).join(''):'<div class="empty">No orders yet.</div>';
}

async function loadBalance(){
if(!user)return;
const r=await db.from('Profiles').select('balance').eq('id',user.id).maybeSingle();
if(!r.error&&r.data){profile={...(profile||{}),...r.data};$('myBalance').textContent=(r.data.balance||0)+' Tk'}
}

async function loadAccess(){
if(!user)return $('accessList').innerHTML='<div class="empty">Please Login first.</div>';
const r=await db.from('Orders').select('*').eq('buyer_id',user.id).eq('status','Confirmed').order('id',{ascending:false});
if(r.error)return $('accessList').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';
$('accessList').innerHTML=r.data.length?r.data.map(o=>`<div class="card" style="margin-bottom:10px"><b>Order #${o.id}</b><p>Access Key: <b>${esc(o.access_key||'Not generated yet')}</b></p></div>`).join(''):'<div class="empty">No confirmed access.</div>';
}

function loadProfile(){
if(!user)return $('profileInfo').innerHTML='Please Login first.';
$('profileInfo').innerHTML='<p><b>Name:</b> '+esc(profile?.Name||user.user_metadata?.name||'Buyer')+'</p><p><b>Phone:</b> '+esc(profile?.Phone||user.user_metadata?.phone||'')+'</p><p><b>Email:</b> '+esc(user.email)+'</p><button class="btn secondary" onclick="logout()">Logout</button>';
}

function openTopup(){if(!user)return openAuth('login');showPayNumber();$('topupModal').classList.remove('hidden')}
function closeTopup(){$('topupModal').classList.add('hidden')}
function showPayNumber(){const m=$('topMethod').value;$('payNumber').innerHTML=m&&PAY[m]?'<b>'+m+' Number:</b> '+esc(PAY[m]):'Select a payment method.'}

async function submitTopup(){
if(!user)return;
const method=$('topMethod').value,amount=Number($('topAmount').value),txn=$('topTxn').value.trim();
if(!method)return msg('topMsg','Select payment method.',true);
if(!amount||amount<=0)return msg('topMsg','Enter a valid amount.',true);
if(!txn)return msg('topMsg','Enter Transaction ID.',true);
const r=await db.from('Orders').insert([{buyer_id:user.id,status:'Pending',order_type:'Balance Top Up',amount:amount,payment_method:method,transaction_id:txn}]);
if(r.error)return msg('topMsg',r.error.message,true);
msg('topMsg','Top Up request submitted successfully.');
}

async function logout(){await db.auth.signOut();user=null;profile=null;$('topBtn').textContent='Login';$('topBtn').onclick=()=>openAuth('login');showPage('home')}

async function start(){
$('topBtn').textContent='Logout';
$('topBtn').onclick=logout;
await loadPaymentSettings();
await loadPublic();
await loadBalance();
showPage('home');
}

(async()=>{
await loadPaymentSettings();
await loadPublic();
const s=await db.auth.getSession();
if(s.data.session){user=s.data.session.user;try{await ensureProfile();await start()}catch(e){console.error(e)}}
})();
</script>
</body>
</html>
