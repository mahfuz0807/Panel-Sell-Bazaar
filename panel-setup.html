<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Setup | Panel Sell Bazaar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5fb;font-family:Arial,sans-serif;color:#172033}
header{background:#fff;padding:18px;box-shadow:0 2px 12px #0001}header b{font-size:20px;color:#7c3aed}
.wrap{max-width:680px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(120deg,#7c3aed,#ec4899);color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none;margin-top:10px}
.muted{color:#64748b}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:10px}.back{display:inline-block;color:#6d28d9;text-decoration:none;font-weight:700}
</style></head>
<body>
<header><b>🔷 Panel Sell Bazaar</b><div>Panel Setup</div></header>
<main class="wrap"><a class="back" href="javascript:history.back()">← Back</a><div id="content" class="card">Loading...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://wiztksrtzjmsxzolollf.supabase.co","sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi");
const q=new URLSearchParams(location.search),pid=q.get('package'),idx=q.get('panel');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function yt(v){try{const u=new URL(v),id=u.hostname.includes('youtu.be')?u.pathname.slice(1):(u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop());return id?'https://www.youtube.com/embed/'+encodeURIComponent(id):''}catch(e){return ''}}
async function init(){
 if(!pid){content.textContent='Package not found';return}
 const {data:p,error}=await db.from('Package').select('id,title,panel_link,panel_link_caption,panel_links').eq('id',pid).maybeSingle();
 if(error||!p){content.textContent=error?.message||'Package not found';return}
 const rows=Array.isArray(p.panel_links)?p.panel_links.filter(x=>x&&(x.name||x.url||x.video)):[];
 if(!rows.length&&p.panel_link)rows.push({name:p.panel_link_caption||'Open Panel',url:p.panel_link,video:''});
 if(idx===null){
  content.innerHTML='<h2>'+esc(p.title)+'</h2><p class="muted">আপনার প্যানেল নির্বাচন করুন</p>'+
   (rows.length?rows.map((x,i)=>'<a class="btn" href="panel-setup.html?package='+encodeURIComponent(pid)+'&panel='+i+'">'+esc(x.name||('Panel '+(i+1)))+'</a>').join(''):'<p>এখনো কোনো Panel Link যোগ করা হয়নি।</p>');
  return;
 }
 const x=rows[Number(idx)];if(!x){content.textContent='Panel not found';return}
 const embed=yt(x.video||'');
 content.innerHTML='<h2>'+esc(x.name||'Panel Setup')+'</h2><h3>Panel Setup Video</h3>'+
  (embed?'<iframe class="video" src="'+esc(embed)+'" allowfullscreen></iframe>':(x.video?'<a class="btn" target="_blank" rel="noopener" href="'+esc(x.video)+'">▶ Watch Setup Video</a>':'<p class="muted">Setup video দেওয়া হয়নি।</p>'))+
  (x.url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(x.url)+'">🔗 Open Panel</a>':'<p>Panel URL দেওয়া হয়নি।</p>');
}
init();
</script></body></html>
