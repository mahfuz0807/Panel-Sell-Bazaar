<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Sell Bazaar - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#0b1020;
  color:white;
  margin:0;
}
header{
  padding:18px;
  background:#121a30;
  display:flex;
  justify-content:space-between;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.box{
  background:#121a30;
  padding:20px;
  margin:20px 0;
  border-radius:12px;
}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  box-sizing:border-box;
  background:#0b1020;
  color:white;
  border:1px solid #40527d;
  border-radius:7px;
}
button{
  padding:11px 16px;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}
.login,.save{
  background:#4285f4;
  color:white;
}
.edit{background:#f39c12;color:white}
.delete{background:#e74c3c;color:white}
.logout{background:#e74c3c;color:white}
.hidden{display:none}
.item{
  background:#0b1020;
  padding:15px;
  margin:12px 0;
  border-radius:10px;
  border:1px solid #29365d;
}
.msg{
  margin-top:12px;
  color:#7ee2ff;
}
</style>
</head>

<body>

<header>
  <b>Panel Sell Bazaar — Admin</b>
  <button id="logout" class="logout hidden" onclick="logout()">Logout</button>
</header>

<div id="loginBox" class="container">
  <div class="box">
    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="email" type="email">

    <label>Password</label>
    <input id="password" type="password">

    <button class="login" onclick="adminLogin()">Login</button>

    <div id="loginMsg" class="msg"></div>
  </div>
</div>


<div id="adminBox" class="container hidden">

  <div class="box">
    <h2>Package Management</h2>

    <label>Package Title</label>
    <input id="title" placeholder="Aim Hacker">

    <label>Price</label>
    <input id="price" type="number" placeholder="20">

    <label>Duration</label>
    <input id="duration" placeholder="1 Hour">

    <button id="saveBtn" class="save" onclick="savePackage()">
      Add Package
    </button>

    <button id="cancelBtn" class="delete hidden" onclick="cancelEdit()">
      Cancel
    </button>

    <div id="packageMsg" class="msg"></div>

    <h3>Existing Packages</h3>
    <div id="packages"></div>
  </div>


  <div class="box">
    <h2>Customer Orders</h2>

    <button class="login" onclick="loadOrders()">
      Refresh Orders
    </button>

    <div id="orderMsg" class="msg"></div>
    <div id="orders"></div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://wiztksrtzjmsxzolollf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editId = null;


/* LOGIN */

async function adminLogin(){

  const msg = document.getElementById("loginMsg");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    msg.innerText = "Email এবং Password দিন।";
    return;
  }

  msg.innerText = "Login হচ্ছে...";

  const {data,error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){
    msg.innerText =
      "Login failed: " + error.message;
    return;
  }

  const profile =
    await db.from("Profiles")
    .select('"Role"')
    .eq("id",data.user.id)
    .maybeSingle();

  if(profile.error){
    msg.innerText =
      "Profile error: " + profile.error.message;
    await db.auth.signOut();
    return;
  }

  if(
    !profile.data ||
    String(profile.data.Role).toLowerCase() !== "admin"
  ){
    msg.innerText =
      "এই account-এর Admin access নেই।";
    await db.auth.signOut();
    return;
  }

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminBox")
    .classList.remove("hidden");

  document.getElementById("logout")
    .classList.remove("hidden");

  await loadPackages();
  await loadOrders();
}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* PACKAGES */

async function loadPackages(){

  const box =
    document.getElementById("packages");

  const result =
    await db.from("Package")
    .select("id,title,price,duration")
    .order("id",{ascending:true});

  if(result.error){
    document.getElementById("packageMsg").innerText =
      "Package load failed: " +
      result.error.message;
    return;
  }

  box.innerHTML = "";

  if(!result.data.length){
    box.innerHTML = "<p>No packages found.</p>";
    return;
  }

  result.data.forEach(p => {

    box.innerHTML += `
      <div class="item">

        <h3>${escapeHtml(p.title)}</h3>

        <p>Price: ৳${Number(p.price)}</p>

        <p>Duration: ${escapeHtml(p.duration)}</p>

        <button class="edit"
          onclick="editPackage(
            ${p.id},
            ${JSON.stringify(p.title)},
            ${Number(p.price)},
            ${JSON.stringify(p.duration)}
          )">
          Edit
        </button>

        <button class="delete"
          onclick="deletePackage(${p.id})">
          Delete
        </button>

      </div>
    `;
  });
}


/* ADD / UPDATE */

async function savePackage(){

  const title =
    document.getElementById("title").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const duration =
    document.getElementById("duration").value.trim();

  const msg =
    document.getElementById("packageMsg");

  if(!title || !duration || Number.isNaN(price)){
    msg.innerText =
      "Title, Price এবং Duration ঠিকভাবে দিন।";
    return;
  }

  msg.innerText = "Saving...";

  let result;

  if(editId !== null){

    result =
      await db.from("Package")
      .update({
        title:title,
        price:price,
        duration:duration
      })
      .eq("id",editId);

  }else{

    result =
      await db.from("Package")
      .insert([{
        title:title,
        price:price,
        duration:duration
      }]);

  }

  if(result.error){
    msg.innerText =
      "Save failed: " + result.error.message;
    return;
  }

  msg.innerText =
    editId !== null
    ? "Package updated."
    : "Package added.";

  cancelEdit();
  await loadPackages();
}


/* EDIT */

function editPackage(id,title,price,duration){

  editId = id;

  document.getElementById("title").value = title;
  document.getElementById("price").value = price;
  document.getElementById("duration").value = duration;

  document.getElementById("saveBtn").innerText =
    "Update Package";

  document.getElementById("cancelBtn")
    .classList.remove("hidden");
}


/* CANCEL */

function cancelEdit(){

  editId = null;

  document.getElementById("title").value = "";
  document.getElementById("price").value = "";
  document.getElementById("duration").value = "";

  document.getElementById("saveBtn").innerText =
    "Add Package";

  document.getElementById("cancelBtn")
    .classList.add("hidden");
}


/* DELETE */

async function deletePackage(id){

  if(!confirm("এই package delete করবেন?"))
    return;

  const result =
    await db.from("Package")
    .delete()
    .eq("id",id);

  if(result.error){
    document.getElementById("packageMsg").innerText =
      "Delete failed: " + result.error.message;
    return;
  }

  await loadPackages();
}


/* ORDERS */

async function loadOrders(){

  const box =
    document.getElementById("orders");

  const msg =
    document.getElementById("orderMsg");

  msg.innerText = "Orders loading...";

  const result =
    await db.from("Orders")
    .select(
      'user_id,buyer_name,phone,"package title",price,duration,status,"payment method","transaction id"'
    );

  if(result.error){
    msg.innerText =
      "Order load failed: " +
      result.error.message;
    return;
  }

  box.innerHTML = "";

  if(!result.data.length){
    box.innerHTML = "<p>No orders found.</p>";
    msg.innerText = "";
    return;
  }

  result.data.forEach((o,i)=>{

    box.innerHTML += `
      <div class="item">

        <h3>Order #${i+1}</h3>

        <p>Buyer: ${escapeHtml(o.buyer_name)}</p>
        <p>Phone: ${escapeHtml(o.phone)}</p>
        <p>Package: ${escapeHtml(o["package title"])}</p>
        <p>Price: ৳${Number(o.price || 0)}</p>
        <p>Duration: ${escapeHtml(o.duration)}</p>
        <p>Payment: ${escapeHtml(o["payment method"])}</p>
        <p>Transaction ID:
          ${escapeHtml(o["transaction id"])}
        </p>

        <p>Status:
          <b>${escapeHtml(o.status || "Pending")}</b>
        </p>

      </div>
    `;
  });

  msg.innerText = "";
}


/* SECURITY */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
