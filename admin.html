<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Sell Bazaar - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b1020;
  color:white;
  min-height:100vh;
}

header{
  background:#121a30;
  padding:18px;
  border-bottom:1px solid #29365d;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.box{
  background:#121a30;
  border:1px solid #29365d;
  border-radius:14px;
  padding:25px;
  margin-bottom:20px;
}

.login-box{
  max-width:450px;
  margin:50px auto;
}

h1{
  margin-bottom:10px;
}

h2{
  margin-bottom:18px;
}

h3{
  margin-bottom:10px;
}

.info{
  color:#aeb8d4;
  font-size:14px;
  line-height:1.5;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:13px;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #394a78;
  background:#0b1020;
  color:white;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn,
.main-btn{
  background:#4f8cff;
  color:white;
}

.main-btn{
  width:100%;
  margin-top:18px;
}

.add-btn{
  background:#20b86b;
  color:white;
  margin-top:18px;
}

.edit-btn{
  background:#f39c12;
  color:white;
  margin-right:6px;
}

.delete-btn{
  background:#e74c3c;
  color:white;
}

.logout-btn{
  background:#e74c3c;
  color:white;
}

.hidden{
  display:none!important;
}

.message{
  margin-top:15px;
  color:#7ee2ff;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.list{
  display:grid;
  gap:15px;
  margin-top:20px;
}

.item{
  background:#0b1020;
  border:1px solid #29365d;
  border-radius:12px;
  padding:18px;
}

.item p{
  color:#c5cee4;
  margin:7px 0;
  line-height:1.5;
}

.price{
  color:#7ee2ff;
  font-size:20px;
  font-weight:bold;
}

.divider{
  height:1px;
  background:#29365d;
  margin:25px 0;
}

.status-pending{
  color:#f1c40f;
  font-weight:bold;
}

.status-completed{
  color:#20b86b;
  font-weight:bold;
}

.status-cancelled{
  color:#e74c3c;
  font-weight:bold;
}

.small-btn{
  margin-top:8px;
}

.order-select{
  margin-top:10px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    Panel Sell Bazaar — Admin
  </div>

  <button
    id="logoutButton"
    class="logout-btn hidden"
    onclick="logout()">

    Logout

  </button>

</header>


<!-- LOGIN -->

<div
  id="loginSection"
  class="container">

  <div class="box login-box">

    <h1>Admin Login</h1>

    <p class="info">
      Login with your Supabase Admin account.
    </p>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Admin email">


    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Admin password">


    <button
      class="main-btn"
      onclick="adminLogin()">

      Login

    </button>


    <div
      id="loginMessage"
      class="message">
    </div>

  </div>

</div>



<!-- ADMIN -->

<div
  id="adminSection"
  class="container hidden">


  <!-- PACKAGE -->

  <div class="box">

    <h1>Package Management</h1>

    <p class="info">
      এখান থেকে Package Add, Edit এবং Delete করতে পারবেন।
    </p>


    <div class="grid">

      <div>

        <label>Package Title</label>

        <input
          id="packageTitle"
          type="text"
          placeholder="Aim Hacker">

      </div>


      <div>

        <label>Price</label>

        <input
          id="packagePrice"
          type="number"
          min="0"
          placeholder="20">

      </div>


      <div>

        <label>Duration</label>

        <input
          id="packageDuration"
          type="text"
          placeholder="1 Hour">

      </div>

    </div>


    <button
      id="savePackageButton"
      class="add-btn"
      onclick="savePackage()">

      Add Package

    </button>


    <button
      id="cancelEditButton"
      class="delete-btn hidden"
      onclick="cancelEdit()">

      Cancel Edit

    </button>


    <div
      id="packageMessage"
      class="message">
    </div>


    <div class="divider"></div>


    <h2>Existing Packages</h2>


    <div
      id="packageList"
      class="list">
    </div>

  </div>



  <!-- ORDERS -->

  <div class="box">

    <h1>Customer Orders</h1>

    <p class="info">
      Buyer-এর order এবং payment information এখানে দেখা যাবে।
    </p>


    <button
      class="main-btn"
      onclick="loadOrders()">

      Refresh Orders

    </button>


    <div
      id="orderMessage"
      class="message">
    </div>


    <div
      id="orderList"
      class="list">
    </div>

  </div>


</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://wiztksrtzjmsxzolollf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi";


let supabaseClient;


/* =========================
   START SUPABASE
========================= */

try{

  if(!window.supabase){

    throw new Error(
      "Supabase library load হয়নি। Internet connection check করুন।"
    );

  }


  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


}catch(error){

  document.getElementById(
    "loginMessage"
  ).innerText =
    "Supabase error: " +
    error.message;

}



/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  const message =
    document.getElementById(
      "loginMessage"
    );


  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  if(!email || !password){

    message.innerText =
      "Email এবং password দিন।";

    return;

  }


  message.innerText =
    "Login হচ্ছে...";


  try{

    const result =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,

          password:password

        });


    if(result.error){

      message.innerText =
        "Login failed: " +
        result.error.message;

      return;

    }


    if(!result.data.user){

      message.innerText =
        "User পাওয়া যায়নি।";

      return;

    }


    /* CHECK PROFILE */

    const profile =
      await supabaseClient
        .from("Profiles")
        .select('"Role"')
        .eq(
          "id",
          result.data.user.id
        )
        .maybeSingle();


    if(profile.error){

      await supabaseClient.auth.signOut();

      message.innerText =
        "Profile check failed: " +
        profile.error.message;

      return;

    }


    if(
      !profile.data ||
      String(profile.data.Role)
        .toLowerCase() !== "admin"
    ){

      await supabaseClient.auth.signOut();

      message.innerText =
        "এই account-এর Admin access নেই।";

      return;

    }


    /* SHOW ADMIN */

    document
      .getElementById("loginSection")
      .classList
      .add("hidden");


    document
      .getElementById("adminSection")
      .classList
      .remove("hidden");


    document
      .getElementById("logoutButton")
      .classList
      .remove("hidden");


    message.innerText =
      "";


    await loadPackages();

    await loadOrders();


  }catch(error){

    message.innerText =
      "Error: " +
      error.message;

  }

}



/* =========================
   SESSION CHECK
========================= */

async function checkSession(){

  if(!supabaseClient){

    return;

  }


  try{

    const result =
      await supabaseClient.auth
        .getSession();


    if(!result.data.session){

      return;

    }


    const user =
      result.data.session.user;


    const profile =
      await supabaseClient
        .from("Profiles")
        .select('"Role"')
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if(
      profile.data &&
      String(profile.data.Role)
        .toLowerCase() === "admin"
    ){

      document
        .getElementById("loginSection")
        .classList
        .add("hidden");


      document
        .getElementById("adminSection")
        .classList
        .remove("hidden");


      document
        .getElementById("logoutButton")
        .classList
        .remove("hidden");


      await loadPackages();

      await loadOrders();

    }

  }catch(error){

    console.log(
      "Session check:",
      error.message
    );

  }

}



/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();


  document
    .getElementById("adminSection")
    .classList
    .add("hidden");


  document
    .getElementById("loginSection")
    .classList
    .remove("hidden");


  document
    .getElementById("logoutButton")
    .classList
    .add("hidden");

}



/* =========================
   LOAD PACKAGES
========================= */

async function loadPackages(){

  const list =
    document.getElementById(
      "packageList"
    );


  const message =
    document.getElementById(
      "packageMessage"
    );


  message.innerText =
    "Packages loading...";


  const result =
    await supabaseClient
      .from("Package")
      .select(
        "id,title,price,duration"
      )
      .order(
        "id",
        {
          ascending:true
        }
      );


  if(result.error){

    message.innerText =
      "Package load failed: " +
      result.error.message;

    return;

  }


  if(
    !result.data ||
    result.data.length === 0
  ){

    list.innerHTML =
      "<p class='info'>No packages found.</p>";

    message.innerText =
      "";

    return;

  }


  list.innerHTML =
    "";


  result.data.forEach(
    function(pkg){

      list.innerHTML += `

        <div class="item">

          <h3>
            ${escapeHtml(pkg.title)}
          </h3>

          <p class="price">
            ৳${Number(pkg.price).toFixed(0)}
          </p>

          <p>
            Duration:
            ${escapeHtml(pkg.duration)}
          </p>

          <p>
            ID:
            ${escapeHtml(pkg.id)}
          </p>


          <button
            class="edit-btn small-btn"
            onclick='editPackage(
              ${pkg.id},
              ${JSON.stringify(pkg.title)},
              ${Number(pkg.price)},
              ${JSON.stringify(pkg.duration)}
            )'>

            Edit

          </button>


          <button
            class="delete-btn small-btn"
            onclick="deletePackage(${pkg.id})">

            Delete

          </button>

        </div>

      `;

    }
  );


  message.innerText =
    "";

}



/* =========================
   SAVE PACKAGE
========================= */

async function savePackage(){

  const title =
    document.getElementById(
      "packageTitle"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "packagePrice"
      ).value
    );


  const duration =
    document.getElementById(
      "packageDuration"
    ).value.trim();


  const message =
    document.getElementById(
      "packageMessage"
    );


  if(!title){

    message.innerText =
      "Package title দিন।";

    return;

  }


  if(
    Number.isNaN(price) ||
    price < 0
  ){

    message.innerText =
      "সঠিক price দিন।";

    return;

  }


  if(!duration){

    message.innerText =
      "Duration দিন।";

    return;

  }


  message.innerText =
    "Saving...";


  let result;


  if(editingPackageId !== null){

    result =
      await supabaseClient
        .from("Package")
        .update({

          title:title,

          price:price,

          duration:duration

        })
        .eq(
          "id",
          editingPackageId
        );


  }else{

    result =
      await supabaseClient
        .from("Package")
        .insert([{

          title:title,

          price:price,

          duration:duration

        }]);

  }


  if(result.error){

    message.innerText =
      "Save failed: " +
      result.error.message;

    return;

  }


  message.innerText =
    editingPackageId !== null
      ? "Package updated successfully."
      : "Package added successfully.";


  clearPackageForm();

  await loadPackages();

}



/* =========================
   EDIT PACKAGE
========================= */

function editPackage(
  id,
  title,
  price,
  duration
){

  editingPackageId =
    id;


  document.getElementById(
    "packageTitle"
  ).value =
    title;


  document.getElementById(
    "packagePrice"
  ).value =
    price;


  document.getElementById(
    "packageDuration"
  ).value =
    duration;


  document.getElementById(
    "savePackageButton"
  ).innerText =
    "Update Package";


  document.getElementById(
    "cancelEditButton"
  ).classList
  .remove("hidden");


  document.getElementById(
    "packageMessage"
  ).innerText =
    "Editing Package ID: " +
    id;

}



/* =========================
   EDIT ID
========================= */

let editingPackageId =
  null;



/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  clearPackageForm();

}



/* =========================
   CLEAR PACKAGE FORM
========================= */

function clearPackageForm(){

  editingPackageId =
    null;


  document.getElementById(
    "packageTitle"
  ).value =
    "";


  document.getElementById(
    "packagePrice"
  ).value =
    "";


  document.getElementById(
    "packageDuration"
  ).value =
    "";


  document.getElementById(
    "savePackageButton"
  ).innerText =
    "Add Package";


  document.getElementById(
    "cancelEditButton"
  ).classList
  .add("hidden");

}



/* =========================
   DELETE PACKAGE
========================= */

async function deletePackage(id){

  if(
    !confirm(
      "এই package delete করতে চান?"
    )
  ){

    return;

  }


  const message =
    document.getElementById(
      "packageMessage"
    );


  message.innerText =
    "Deleting...";


  const result =
    await supabaseClient
      .from("Package")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    message.innerText =
      "Delete failed: " +
      result.error.message;

    return;

  }


  message.innerText =
    "Package deleted successfully.";


  await loadPackages();

}



/* =========================
   LOAD ORDERS
========================= */
