<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Sell Bazaar - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
header{
  background:#fff;
  padding:18px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}
header h2{margin:0}
.container{padding:15px;padding-bottom:90px}
.section{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0000000d;
}
input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}
button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}
button.danger{background:#d93025}
button.green{background:#16803c}
.card{
  border:1px solid #eee;
  padding:12px;
  border-radius:12px;
  margin:10px 0;
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  z-index:20;
}
nav button{
  margin:0;
  border-radius:0;
  background:white;
  color:#333;
  font-size:12px;
}
nav button.active{
  background:#111;
  color:white;
}
.hidden{display:none}
.small{font-size:13px;color:#666}
.price{font-weight:bold;font-size:18px}
</style>
</head>

<body>

<header>
  <h2>Panel Sell Bazaar</h2>
  <div class="small">Admin Panel</div>
</header>

<div class="container">

<!-- HOME -->
<div id="home" class="page">
  <div class="section">
    <h3>Dashboard</h3>
    <p>Total Packages: <b id="packageCount">0</b></p>
    <p>Total Orders: <b id="orderCount">0</b></p>
    <p>Total Buyers: <b id="buyerCount">0</b></p>
  </div>
</div>

<!-- PACKAGES -->
<div id="packages" class="page hidden">

  <div class="section">
    <h3>Add Package</h3>

    <input id="packageTitle" placeholder="Package name">
    <input id="packagePrice" type="number" placeholder="Price">
    <input id="packageDuration" placeholder="Duration">
    <input id="packageImage" placeholder="Image URL">
    <input id="packageLink" placeholder="Panel Link">

    <button onclick="addPackage()">Add Package</button>
  </div>

  <div class="section">
    <h3>All Packages</h3>
    <div id="packageList">Loading...</div>
  </div>

</div>

<!-- ORDERS -->
<div id="orders" class="page hidden">

  <div class="section">
    <h3>All Orders</h3>
    <div id="orderList">Loading...</div>
  </div>

</div>

<!-- BALANCE -->
<div id="balance" class="page hidden">

  <div class="section">
    <h3>Buyer Balances</h3>
    <div id="balanceList">Loading...</div>
  </div>

</div>

<!-- ACCESS -->
<div id="access" class="page hidden">

  <div class="section">
    <h3>Access / Panel Links</h3>
    <div id="accessList">Loading...</div>
  </div>

</div>

<!-- PROFILE -->
<div id="profile" class="page hidden">

  <div class="section">
    <h3>Admin Profile</h3>
    <p id="adminName">Loading...</p>
    <p id="adminPhone"></p>
    <button class="danger" onclick="logout()">Logout</button>
  </div>

</div>

</div>

<nav>
  <button class="active" onclick="showPage('home',this)">Home</button>
  <button onclick="showPage('packages',this)">Packages</button>
  <button onclick="showPage('orders',this)">Orders</button>
  <button onclick="showPage('balance',this)">Balance</button>
  <button onclick="showPage('access',this)">Access</button>
  <button onclick="showPage('profile',this)">Profile</button>
</nav>

<script>

const SUPABASE_URL =
"https://wiztksrtzjmsxzolollf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n64cu-NLfhsdEeJuntjWmw_mhbFhjBi";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


// ---------------- PAGE ----------------

function showPage(page,btn){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(page)
    .classList.remove("hidden");

  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  if(page==="packages") loadPackages();
  if(page==="orders") loadOrders();
  if(page==="balance") loadBalances();
  if(page==="access") loadAccess();
}


// ---------------- CHECK ADMIN ----------------

async function checkAdmin(){

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user){
    location.href="index.html";
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("Profiles")
      .select("*")
      .eq("id",user.id)
      .single();

  if(error || !data || data.Role !== "admin"){
    alert("Admin access denied");
    location.href="index.html";
    return;
  }

  document.getElementById("adminName").innerText =
    "Name: " + (data.Name || "");

  document.getElementById("adminPhone").innerText =
    "Phone: " + (data.Phone || "");

  loadDashboard();
}


// ---------------- DASHBOARD ----------------

async function loadDashboard(){

  const {count:pc} =
    await supabaseClient
      .from("Package")
      .select("*",{count:"exact",head:true});

  const {count:oc} =
    await supabaseClient
      .from("Orders")
      .select("*",{count:"exact",head:true});

  const {count:bc} =
    await supabaseClient
      .from("Profiles")
      .select("*",{count:"exact",head:true})
      .eq("Role","buyer");

  document.getElementById("packageCount").innerText = pc || 0;
  document.getElementById("orderCount").innerText = oc || 0;
  document.getElementById("buyerCount").innerText = bc || 0;
}


// ---------------- PACKAGE ADD ----------------

async function addPackage(){

  const title =
    document.getElementById("packageTitle").value.trim();

  const price =
    document.getElementById("packagePrice").value;

  const duration =
    document.getElementById("packageDuration").value.trim();

  const image_url =
    document.getElementById("packageImage").value.trim();

  const panel_link =
    document.getElementById("packageLink").value.trim();

  if(!title || !price || !duration){
    alert("Title, price and duration are required");
    return;
  }

  const {error} =
    await supabaseClient
      .from("Package")
      .insert([{
        title:title,
        price:Number(price),
        duration:duration,
        image_url:image_url,
        panel_link:panel_link
      }]);

  if(error){
    alert(error.message);
    return;
  }

  alert("Package added successfully");

  document.getElementById("packageTitle").value="";
  document.getElementById("packagePrice").value="";
  document.getElementById("packageDuration").value="";
  document.getElementById("packageImage").value="";
  document.getElementById("packageLink").value="";

  loadPackages();
  loadDashboard();
}


// ---------------- PACKAGES ----------------

async function loadPackages(){

  const box =
    document.getElementById("packageList");

  box.innerHTML="Loading...";

  const {data,error} =
    await supabaseClient
      .from("Package")
      .select("*")
      .order("id",{ascending:false});

  if(error){
    box.innerHTML="Error: "+error.message;
    return;
  }

  if(!data || data.length===0){
    box.innerHTML="No packages found";
    return;
  }

  box.innerHTML="";

  data.forEach(p=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <b>${escapeHtml(p.title)}</b>
      <p class="price">৳${p.price}</p>
      <p>Duration: ${escapeHtml(p.duration)}</p>

      <input id="title_${p.id}" value="${escapeAttr(p.title)}">
      <input id="price_${p.id}" type="number" value="${p.price}">
      <input id="duration_${p.id}" value="${escapeAttr(p.duration)}">
      <input id="image_${p.id}" value="${escapeAttr(p.image_url || "")}" placeholder="Image URL">
      <input id="link_${p.id}" value="${escapeAttr(p.panel_link || "")}" placeholder="Panel Link">

      <button onclick="updatePackage(${p.id})">
        Update
      </button>

      <button class="danger" onclick="deletePackage(${p.id})">
        Delete
      </button>
    `;

    box.appendChild(div);
  });
}


// ---------------- PACKAGE UPDATE ----------------

async function updatePackage(id){

  const title =
    document.getElementById("title_"+id).value.trim();

  const price =
    document.getElementById("price_"+id).value;

  const duration =
    document.getElementById("duration_"+id).value.trim();

  const image_url =
    document.getElementById("image_"+id).value.trim();

  const panel_link =
    document.getElementById("link_"+id).value.trim();

  const {error} =
    await supabaseClient
      .from("Package")
      .update({
        title:title,
        price:Number(price),
        duration:duration,
        image_url:image_url,
        panel_link:panel_link
      })
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Package updated");
  loadPackages();
}


// ---------------- PACKAGE DELETE ----------------

async function deletePackage(id){

  if(!confirm("Delete this package?")) return;

  const {error} =
    await supabaseClient
      .from("Package")
      .delete()
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Package deleted");
  loadPackages();
  loadDashboard();
}


// ---------------- ORDERS ----------------

async function loadOrders(){

  const box =
    document.getElementById("orderList");

  box.innerHTML="Loading...";

  const {data,error} =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("id",{ascending:false});

  if(error){
    box.innerHTML="Error: "+error.message;
    return;
  }

  if(!data || data.length===0){
    box.innerHTML="No orders found";
    return;
  }

  box.innerHTML="";

  data.forEach(o=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <b>${escapeHtml(o.buyer_name || "")}</b>

      <p>
      Package: ${escapeHtml(o.package_title || "")}
      </p>

      <p>
      Price: ৳${o.price || 0}
      </p>

      <p>
      Duration: ${escapeHtml(o.duration || "")}
      </p>

      <p>
      Payment: ${escapeHtml(o.payment_method || "")}
      </p>

      <p>
      Transaction ID:
      <b>${escapeHtml(o.transaction_id || "")}</b>
      </p>

      <p>
      Status:
      <b>${escapeHtml(o.status || "")}</b>
      </p>

      <input
        id="key_${o.id}"
        value="${escapeAttr(o.access_key || "")}"
        placeholder="Access Key"
      >

      <select id="status_${o.id}">
        <option value="Pending" ${o.status==="Pending"?"selected":""}>
          Pending
        </option>

        <option value="Confirmed" ${o.status==="Confirmed"?"selected":""}>
          Confirmed
        </option>

        <option value="Cancelled" ${o.status==="Cancelled"?"selected":""}>
          Cancelled
        </option>
      </select>

      <button class="green"
        onclick="updateOrder(${o.id})">
        Save Order
      </button>
    `;

    box.appendChild(div);
  });
}


// ---------------- UPDATE ORDER ----------------

async function updateOrder(id){

  const status =
    document.getElementById("status_"+id).value;

  const access_key =
    document.getElementById("key_"+id).value.trim();

  const {data:oldOrder,error:oldError} =
    await supabaseClient
      .from("Orders")
      .select("*")
      .eq("id",id)
      .single();

  if(oldError){
    alert(oldError.message);
    return;
  }

  // Balance Top Up
  if(
    oldOrder.package_title === "Balance Top Up" &&
    oldOrder.status !== "Confirmed" &&
    status === "Confirmed"
  ){

    const {data:profile,error:profileError} =
      await supabaseClient
        .from("Profiles")
        .select("balance")
        .eq("id",oldOrder.user_id)
        .single();

    if(profileError){
      alert(profileError.message);
      return;
    }

    const newBalance =
      Number(profile.balance || 0) +
      Number(oldOrder.price || 0);

    const {error:updateBalanceError} =
      await supabaseClient
        .from("Profiles")
        .update({balance:newBalance})
        .eq("id",oldOrder.user_id);

    if(updateBalanceError){
      alert(updateBalanceError.message);
      return;
    }

    await supabaseClient
      .from("BalanceTransactions")
      .insert([{
        user_id:oldOrder.user_id,
        amount:Number(oldOrder.price || 0),
        type:"credit",
        note:"Balance Top Up"
      }]);
  }

  const {error} =
    await supabaseClient
      .from("Orders")
      .update({
        status:status,
        access_key:access_key
      })
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Order updated");

  loadOrders();
  loadBalances();
}


// ---------------- BALANCES ----------------

async function loadBalances(){

  const box =
    document.getElementById("balanceList");

  box.innerHTML="Loading...";

  const {data,error} =
    await supabaseClient
      .from("Profiles")
      .select("*")
      .eq("Role","buyer")
      .order("Name");

  if(error){
    box.innerHTML="Error: "+error.message;
    return;
  }

  box.innerHTML="";

  if(!data || data.length===0){
    box.innerHTML="No buyers found";
    return;
  }

  data.forEach(p=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <b>${escapeHtml(p.Name || "Buyer")}</b>
      <p>${escapeHtml(p.Phone || "")}</p>
      <p>Current Balance: <b>৳${p.balance || 0}</b></p>

      <input
        id="balance_${p.id}"
        type="number"
        placeholder="New balance"
        value="${p.balance || 0}"
      >

      <button onclick="changeBalance('${p.id}')">
        Update Balance
      </button>
    `;

    box.appendChild(div);
  });
}


// ---------------- CHANGE BALANCE ----------------

async function changeBalance(id){

  const value =
    document.getElementById("balance_"+id).value;

  const amount=Number(value);

  if(amount < 0){
    alert("Balance cannot be negative");
    return;
  }

  const {error} =
    await supabaseClient
      .from("Profiles")
      .update({balance:amount})
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Balance updated");
  loadBalances();
}


// ---------------- ACCESS ----------------

async function loadAccess(){

  const box =
    document.getElementById("accessList");

  box.innerHTML="Loading...";

  const {data,error} =
    await supabaseClient
      .from("Orders")
      .select("*")
      .eq("status","Confirmed")
      .neq("package_title","Balance Top Up")
      .order("id",{ascending:false});

  if(error){
    box.innerHTML="Error: "+error.message;
    return;
  }

  box.innerHTML="";

  if(!data || data.length===0){
    box.innerHTML="No confirmed access found";
    return;
  }

  data.forEach(o=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <b>${escapeHtml(o.buyer_name || "")}</b>

      <p>
      Package:
      ${escapeHtml(o.package_title || "")}
      </p>

      <p>
      Key:
      <b>${escapeHtml(o.access_key || "Not set")}</b>
      </p>
    `;

    box.appendChild(div);
  });
}


// ---------------- LOGOUT ----------------

async function logout(){

  await supabaseClient.auth.signOut();

  location.href="index.html";
}


// ---------------- SECURITY HELPERS ----------------

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}


// START

checkAdmin();

</script>

</body>
</html>
